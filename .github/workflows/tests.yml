name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: python -m pip install '.[zstd]'
      - run: npm ci --prefix tests --ignore-scripts --no-audit --no-fund
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.test.js
      - run: python -m compileall -q workledger
      - run: for script in scripts/*.sh *.command; do bash -n "$script"; done
      - run: python -m workledger demo --output "$RUNNER_TEMP/workledger-demo" --no-open
      - run: python scripts/render-analysis-fixture.py --output "$RUNNER_TEMP/workledger-analysis-fixture"
