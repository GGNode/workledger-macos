<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>WorkLedger 配对</title><style>body{font:14px/1.7 -apple-system,sans-serif;min-width:340px;max-width:600px;padding:20px;margin:auto;color:#203346}h1{font-size:22px}label{display:block;margin:12px 0}input[type=text],input[type=password]{width:100%;padding:8px;box-sizing:border-box}button{padding:8px 14px;margin-right:8px}#status{white-space:pre-wrap}small{color:#68788a}</style></head><body><h1>WorkLedger · 网页采集</h1><p>仅记录确认发送后出现的新消息。首次打开、向上滚动出来的旧消息不计入今日。</p><label>本机地址<input id="url" type="text" value="http://127.0.0.1:8765"></label><label>配对码<input id="token" type="password" autocomplete="off"></label><small>运行 workledger pair 获取；不要将配对码发到聊天页面。</small><label><input type="checkbox" id="enabled" checked>启用所支持 AI 网页的采集</label><button id="save">保存</button><button id="test">测试连接</button><div id="status"></div><script src="options.js"></script></body></html>
